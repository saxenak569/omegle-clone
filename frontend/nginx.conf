server {
    listen 80;
    server_name localhost;

    # Use local Docker DNS resolver lazily so Nginx never crashes on startup if hostname is missing
    resolver 127.0.0.11 8.8.8.8 valid=30s ipv6=off;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy REST API requests to Django backend
    location /api/ {
        set $backend_host "http://backend:8000";
        proxy_pass $backend_host;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy WebSocket connections to Django Channels ASGI server
    location /ws/ {
        set $backend_host "http://backend:8000";
        proxy_pass $backend_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }
}
